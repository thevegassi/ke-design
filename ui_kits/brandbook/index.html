<!-- @dsCard group="Brandbook kit" viewport="700x460" name="Brandbook document" subtitle="Click-through recreation of the 1920×1080 guideline pages" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Key Entertainment — Brandbook</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
body{margin:0;background:var(--ke-off-white);font-family:var(--font-display);color:var(--ke-oxford-blue)}
#root{width:700px;margin:0 auto;padding:16px 0}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.n{font-family:var(--font-display);font-weight:600;font-size:11px;padding:7px 12px;border-radius:999px;border:none;cursor:pointer;background:transparent;box-shadow:inset 0 0 0 1px rgba(12,35,80,.18);color:var(--ke-oxford-blue);transition:background var(--dur-base) var(--ease-standard)}
.n:hover{background:rgba(12,35,80,.06)}
.n[aria-current="true"]{background:var(--ke-oxford-blue);color:#fff;box-shadow:none}
.page{box-shadow:0 1px 3px rgba(0,0,0,.08);border-radius:2px;overflow:hidden}
.bar{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:11px;color:var(--text-muted)}
.arrow{background:none;border:none;font:inherit;font-weight:600;color:var(--ke-oxford-blue);cursor:pointer;padding:0}
</style></head><body><div id="root"></div>
<script type="text/babel" src="Pages.jsx"></script>
<script type="text/babel">
const { useState } = React;
function App(){
  const [i,setI]=useState(0);
  const [label,Comp]=PAGES[i];
  return (<>
    <div className="nav">{PAGES.map(([l],k)=>(
      <button key={l} className="n" aria-current={k===i} onClick={()=>setI(k)}>{l}</button>
    ))}</div>
    <div className="page"><Comp/></div>
    <div className="bar">
      <button className="arrow" onClick={()=>setI((i-1+PAGES.length)%PAGES.length)}>← prev</button>
      <span>{label} · {String(i+1).padStart(2,'0')} / {String(PAGES.length).padStart(2,'0')} · 1920 × 1080</span>
      <button className="arrow" onClick={()=>setI((i+1)%PAGES.length)}>next →</button>
    </div>
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
