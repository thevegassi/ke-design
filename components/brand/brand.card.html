<!-- @dsCard group="Components" viewport="700x300" name="Brand — Logo & Pattern" subtitle="Logo lockups, approved grounds, mark pattern" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--ke-white);font-family:var(--font-display)}.wrap{display:flex;flex-direction:column;gap:14px;padding:18px}.row{display:flex;gap:14px;align-items:center}.cap{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { Logo, PatternField } = window.KeyEntertainmentDesignSystem_27049e;
const Tile = ({bg, ink, children}) => <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',height:74,background:bg,borderRadius:12,boxShadow:bg==='transparent'?'inset 0 0 0 1px #000':'none'}}>{children}</div>;
ReactDOM.createRoot(document.getElementById('root')).render(
  <div className="wrap">
    <div className="row">
      <Tile bg="transparent"><Logo height={30} color="#000"/></Tile>
      <Tile bg="var(--ke-black)"><Logo height={30} color="#fff"/></Tile>
      <Tile bg="var(--ke-lime)"><Logo height={30} color="#000"/></Tile>
      <Tile bg="var(--ke-oxford-blue)"><Logo height={30} color="#fff"/></Tile>
    </div>
    <div className="row">
      <Tile bg="transparent"><Logo variant="mark" height={40} color="var(--ke-oxford-blue)"/></Tile>
      <Tile bg="var(--ke-lime)"><Logo variant="mark" height={40} color="#000"/></Tile>
      <Tile bg="var(--ke-tropical-indigo)"><Logo variant="mark" height={40} color="var(--ke-oxford-blue)"/></Tile>
      <PatternField mode="wash" style={{flex:2,height:74,borderRadius:12,background:'var(--ke-periwinkle)'}} />
      <PatternField mode="tile" size={40} color="#fff" style={{flex:2,height:74,borderRadius:12,background:'var(--ke-oxford-blue)'}} />
    </div>
    <div className="row"><span className="cap">Logo · full &amp; mark · approved grounds · PatternField wash / tile</span></div>
  </div>
);
</script></body></html>
