<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-display)}.g{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;padding:16px}.s{height:88px;border-radius:10px;display:flex;align-items:flex-end;padding:10px;box-sizing:border-box;font-size:10px;line-height:1.3;letter-spacing:.02em}</style>
</head><body><div class="g">
<div class="s" style="background:var(--ke-white);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);color:var(--ke-oxford-blue)">#FFFFFF<br>page</div>
<div class="s" style="background:var(--ke-off-white);color:var(--ke-oxford-blue)">#F2F2F2<br>page alt</div>
<div class="s" style="background:var(--ke-periwinkle);color:var(--ke-indigo-ink)">#D0CCFF<br>chapter</div>
<div class="s" style="background:var(--ke-midnight);color:#fff">#07132C<br>chapter dark</div>
<div class="s" style="background:var(--ke-near-black);color:#fff">#0D0D0D<br>invert</div>
<div class="s" style="background:var(--surface-deck);color:#fff">gradient<br>deck</div>
</div></body></html>
