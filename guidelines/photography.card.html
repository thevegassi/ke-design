<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;font-family:var(--font-display)}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.p{height:120px;border-radius:10px;overflow:hidden;display:flex;align-items:flex-end;padding:10px;box-sizing:border-box}
.l{font-size:9px;opacity:.55;margin-top:5px;color:var(--ke-oxford-blue)}.tag{font-size:10px;color:#fff;font-weight:600}</style>
</head><body><div class="g">
<div><div class="p" style="background:url(../assets/images/concert-crowd.jpg) center/cover"></div><div class="l">Raw · no scrim</div></div>
<div><div class="p" style="background:var(--photo-scrim-soft), url(../assets/images/concert-crowd.jpg) center/cover"><span class="tag">37% — thumbnails</span></div><div class="l">Thumbnail scrim</div></div>
<div><div class="p" style="background:var(--photo-scrim), url(../assets/images/concert-crowd.jpg) center/cover"><span class="tag">50% — logo over photo</span></div><div class="l">Logo scrim</div></div>
</div></body></html>
