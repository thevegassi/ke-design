<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;font-family:var(--font-display);color:var(--ke-oxford-blue)}
.field{background:var(--ke-lavender);box-shadow:inset 0 0 0 1px var(--ke-blue-rule);padding:20px;display:inline-block}
.box{background:#fff;box-shadow:inset 0 0 0 1px var(--ke-blue-rule);padding:0;display:flex}
.cap{font-size:10px;opacity:.55;margin-top:10px}
img{display:block;height:60px}</style>
</head><body>
<div class="field"><div class="box"><img src="../assets/logo/logo-horizontal-black.svg" alt="Key Entertainment"></div></div>
<div class="cap">x = 1/3 of the logo height (60px logo → 20px on every side). No graphics, no type, no crop inside x.</div>
</body></html>
