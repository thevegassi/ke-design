<!-- @dsCard group="Spacing" viewport="700x150" name="Cards & elevation" subtitle="No shadows on cards; the only shadow in the file floats a device mock" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;font-family:var(--font-display);display:flex;gap:14px;align-items:flex-start;color:var(--ke-oxford-blue)}
.c{flex:1;border-radius:12px;background:#fff;padding:14px;box-sizing:border-box;height:100px}
.n{font-size:12px;font-weight:700;line-height:1}.d{font-size:10px;opacity:.55;margin-top:8px;line-height:1.4}
.row{flex:1;border-radius:16px;background:rgba(255,255,255,.05);padding:14px;box-sizing:border-box;height:100px;color:#fff}
.dark{background:var(--surface-deck);border-radius:12px;padding:10px;flex:1.2;display:flex}
.dev{flex:.7;height:100px;border-radius:12px;background:var(--ke-off-white);box-shadow:16px 11px 42px rgba(0,0,0,.1),62px 43px 76px rgba(0,0,0,.09)}</style>
</head><body>
<div class="c" style="background:var(--ke-off-white)"><div class="n">Service card</div><div class="d">12px radius · 24px padding · no border, no shadow</div></div>
<div class="dark"><div class="row"><div class="n">Deck row</div><div class="d" style="color:#fff">16px radius · rgba(255,255,255,.05) · flat opacity, no blur</div></div></div>
<div><div class="dev"></div><div class="d">Device mock · the only shadow</div></div>
</body></html>
