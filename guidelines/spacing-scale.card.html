<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="The gaps the file actually uses — 8 to 256px" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;font-family:var(--font-display);color:var(--ke-oxford-blue)}.r{display:flex;align-items:center;gap:10px;margin-bottom:6px}.bar{height:12px;background:var(--ke-tropical-indigo)}.l{font-size:10px;opacity:.5;width:44px;font-variant-numeric:tabular-nums}</style>
</head><body>
<div class="r"><span class="l">8</span><div class="bar" style="width:8px"></div></div>
<div class="r"><span class="l">10</span><div class="bar" style="width:10px"></div></div>
<div class="r"><span class="l">12</span><div class="bar" style="width:12px"></div></div>
<div class="r"><span class="l">24</span><div class="bar" style="width:24px"></div></div>
<div class="r"><span class="l">30 / 32</span><div class="bar" style="width:32px"></div></div>
<div class="r"><span class="l">48</span><div class="bar" style="width:48px"></div></div>
<div class="r"><span class="l">60</span><div class="bar" style="width:60px"></div></div>
<div class="r"><span class="l">72</span><div class="bar" style="width:72px"></div></div>
<div class="r"><span class="l">96</span><div class="bar" style="width:96px"></div></div>
<div class="r"><span class="l">108</span><div class="bar" style="width:108px"></div></div>
<div class="r"><span class="l">256</span><div class="bar" style="width:256px"></div></div>
</body></html>
